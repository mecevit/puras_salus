title: Salus
description: >
  Kişiselleştirilmiş sağlık & beslenme öneri motoru. Kullanıcının hedef, ölçüm
  ve ilerleme verilerinden günlük su, vitamin/takviye, yenecek/yenmeyecek
  yiyecekler ve içecek önerileri üretir. Sayısal hesaplar (BMI, BMR/TDEE,
  kalori, protein) deterministik; öneriler Claude ile kişiselleştirilir.
