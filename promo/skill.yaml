title: Promo Motion Graphics
description: >
  Bir ürün/özellik brief'i alır ve doğrudan bir VIDEO üretir. "Claude Design"
  görsel dilinde (sıcak fildişi + terracotta + serif + spark, gerçek UI + cursor,
  spark/gerund loader, light→dark reveal, plan checklist) saniye-saniye bir
  storyboard ve deterministik bir GSAP HTML animasyonu kurgular; sonra bunu
  worker içinde (Playwright + ffmpeg) kare-kare MP4'e render edip workspace
  drive'a yazar. Çıktı: oynatılabilir bir video URL'i.

entrypoint: SKILL.md
text_model: claude/opus-4-8

input_schema:
  type: object
  required: [brief]
  properties:
    brief:
      type: string
      description: >
        Videonun ne anlatacağı: ürün, ana mesaj, gösterilecek akış/sahneler,
        öne çıkan UI anları.
    product_name:
      type: string
      description: Marka/ürün adı (wordmark + kapanış). Varsayılan "puras".
    accent_color:
      type: string
      description: Tek vurgu rengi (hex). Varsayılan terracotta "#C96442".
    duration_sec:
      type: number
      description: Hedef süre (sn). Varsayılan ~28.

output_schema:
  type: object
  properties:
    title:
      type: string
      description: Videonun kısa başlığı.
    video:
      type: video
      description: Render edilmiş MP4'ün oynatılabilir (signed) URL'i.
    drive_path:
      type: string
      description: Videonun workspace drive yolu (kalıcı pointer).
    storyboard:
      type: array
      description: Saniye-saniye beat listesi (act sırasına göre).
      items:
        type: object
        properties:
          t_start: { type: number }
          t_end: { type: number }
          scene: { type: string }
          on_screen: { type: string }
          camera: { type: string }
          motion: { type: string }
    notes:
      type: string
      description: Renk/metin/tempo notları (opsiyonel).

tools:
  - name: get_template
    description: >
      Cilalı referans animasyon HTML'ini (Claude-Design; tüm CSS + hareket
      makinesi: kamera, morph, cursor, spark, gerund loader, dark reveal, plan
      checklist, __BLUR_SEGMENTS__) döndürür. BURADAN BAŞLA: sıfırdan yazma,
      bunu brief'e uyarla — makineyi koru, sadece sahne metni/etiket/palet
      vurgusu/timing'i değiştir.
    entrypoint: get_template.py:run
    input_schema:
      type: object
      properties: {}
    output_schema:
      type: object
      properties:
        html: { type: text }

  - name: render_video
    description: >
      Verilen tek-dosyalık HTML animasyonunu worker içinde MP4'e render eder ve
      workspace drive'a yazar. HTML; `window.__DURATION__`, `window.__seek(t)` ve
      (opsiyonel) `window.__BLUR_SEGMENTS__` expose ETMELİDİR; GSAP'ı
      `vendor/gsap.min.js`'ten yükleyebilir (kopyası render anında konur). Hedefli
      motion blur sadece __BLUR_SEGMENTS__ pencerelerinde uygulanır. Geri döner:
      video_url (signed), drive_path, duration_sec, frames.
    entrypoint: render_video.py:run
    input_schema:
      type: object
      required: [html]
      properties:
        html:   { type: string,  description: Tek dosyalık, kendi kendine yeten animasyon HTML'i. }
        fps:    { type: integer, description: Kare/sn (varsayılan 30). }
        mblur:  { type: integer, description: Hızlı pencerelerde alt-örnek sayısı (varsayılan 8). }
    output_schema:
      type: object
      properties:
        drive_path:   { type: string }
        video_url:    { type: string }
        sign_error:   { type: string }
        duration_sec: { type: number }
        frames:       { type: integer }
        fps:          { type: integer }
        bytes:        { type: integer }

examples:
  - title: "SKILL.md → çalışan skill"
    inputs:
      brief: >
        Puras: tek bir SKILL.md dosyasından, tool'lar + eval + typed I/O içeren
        çalışan bir skill'e dönüşümü göster. Prompt yazımı, derleme, canlı pipeline.
      product_name: puras
